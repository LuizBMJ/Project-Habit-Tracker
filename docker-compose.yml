services:
  app:
    build:
      context: .
      dockerfile: dockerfile/dev/Dockerfile.dev
    ports:
      - "10000:10000"
      - "5173:5173"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=project_habit_tracker
      - DB_USERNAME=root
      - DB_PASSWORD=root
    volumes:
      - .:/app
      - /app/vendor
      - /app/node_modules
      - laravel_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=project_habit_tracker
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d project_habit_tracker"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

volumes:
  pgdata:
  laravel_storage:

networks:
  app-network:
    driver: bridge
